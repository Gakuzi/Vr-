<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Stable VR Viewer</title>
    <style>
        /* --- БАЗОВЫЙ СБРОС --- */
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; }
        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            background-color: #000; overflow: hidden;
            font-family: -apple-system, sans-serif;
            color: #fff;
        }

        /* --- СЦЕНА VR --- */
        #vr-stage {
            display: flex; width: 100%; height: 100%;
            position: relative; z-index: 1;
        }

        .eye {
            width: 50%; height: 100%;
            position: relative; overflow: hidden;
            border-right: 1px solid #333; background: #000;
        }
        
        /* КОНТЕЙНЕР КОНТЕНТА
           Мы делаем его большим (140%), чтобы было куда двигаться.
           Transition отключен, так как мы двигаем через JS каждый кадр.
        */
        .world {
            position: absolute;
            top: 50%; left: 50%;
            width: 140vw; height: 140vh; 
            transform: translate(-50%, -50%);
            display: flex; justify-content: center; align-items: center;
            will-change: transform; 
        }

        .world img, .world video {
            width: 100%; height: 100%; object-fit: cover;
            pointer-events: none;
        }

        /* --- ИНТЕРФЕЙС --- */
        #ui-layer {
            position: fixed; bottom: 0; left: 0; width: 100%; 
            display: flex; flex-direction: column; align-items: center;
            z-index: 100; transition: opacity 0.3s; padding-bottom: 20px;
            pointer-events: none; /* Пропускаем клики сквозь пустоту */
        }
        
        .dock {
            background: rgba(30,30,30,0.9); 
            padding: 15px 25px; border-radius: 40px;
            display: flex; gap: 20px; pointer-events: auto;
            border: 1px solid rgba(255,255,255,0.2);
        }

        button {
            background: transparent; border: none; color: #fff;
            font-weight: bold; font-size: 14px; text-transform: uppercase;
            padding: 10px; cursor: pointer;
        }
        button:active { opacity: 0.7; }
        
        /* START SCREEN */
        #start-screen {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: #000; z-index: 2000;
            display: flex; flex-direction: column; 
            justify-content: center; align-items: center;
        }
        
        #btn-launch {
            border: 2px solid #0f0; color: #0f0; padding: 20px 50px;
            border-radius: 50px; font-size: 18px; letter-spacing: 2px;
        }

        /* ORIENTATION WARNING */
        #rotate-msg {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: #111; z-index: 3000; display: none;
            justify-content: center; align-items: center; text-align: center;
        }
        @media (orientation: portrait) { #rotate-msg { display: flex; } }

    </style>
</head>
<body>

    <!-- 1. Предупреждение о повороте -->
    <div id="rotate-msg">
        <div>
            <div style="font-size:40px; margin-bottom:10px;">↻</div>
            Поверните смартфон<br>горизонтально
        </div>
    </div>

    <!-- 2. Экран запуска (обязателен для iOS) -->
    <div id="start-screen">
        <button id="btn-launch" onclick="launchVR()">ЗАПУСТИТЬ VR</button>
        <p style="color:#777; font-size:12px; margin-top:15px">Нажмите для доступа к датчикам</p>
    </div>

    <!-- 3. Сцена -->
    <div id="vr-stage">
        <div class="eye"><div class="world" id="w-left"></div></div>
        <div class="eye"><div class="world" id="w-right"></div></div>
    </div>

    <!-- 4. Меню -->
    <div id="ui-layer">
        <div class="dock">
            <button onclick="document.getElementById('in-photo').click()">Фото</button>
            <button onclick="document.getElementById('in-video').click()">Видео</button>
            <button onclick="initCamera()">Камера</button>
            <button onclick="recalibrate()" style="color: yellow">Центр</button>
        </div>
    </div>

    <!-- Inputs -->
    <input type="file" id="in-photo" accept="image/*" style="display:none" onchange="handleFile(this, 'img')">
    <input type="file" id="in-video" accept="video/*" style="display:none" onchange="handleFile(this, 'vid')">

    <script>
        // --- КОНФИГУРАЦИЯ ---
        // SMOOTH_FACTOR: 0.05 = очень плавно (медленно), 0.5 = быстро (но может дрожать)
        const SMOOTH_FACTOR = 0.08; 
        const SENSITIVITY = 15;     // Множитель движения пикселей
        const STEREO_OFFSET = 15;   // Стерео-база
        
        // --- ПЕРЕМЕННЫЕ СОСТОЯНИЯ ---
        let isRunning = false;
        
        // Позиция (текущая сглаженная)
        let curX = 0, curY = 0;
        // Позиция (целевая из датчика)
        let targetX = 0, targetY = 0;
        
        // Калибровка (начальные углы)
        let baseBeta = 0;  // X-axis (Left/Right look in Landscape)
        let baseGamma = 0; // Y-axis (Up/Down look in Landscape)

        const wL = document.getElementById('w-left');
        const wR = document.getElementById('w-right');

        // --- ЗАПУСК ---
        async function launchVR() {
            // 1. Fullscreen
            try {
                if (document.documentElement.requestFullscreen) await document.documentElement.requestFullscreen();
                else if (document.documentElement.webkitRequestFullscreen) await document.documentElement.webkitRequestFullscreen();
            } catch(e){}

            // 2. Permission (iOS)
            if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
                try {
                    const resp = await DeviceOrientationEvent.requestPermission();
                    if (resp !== 'granted') {
                        alert("Нет доступа к гироскопу");
                        return;
                    }
                } catch (e) { alert(e); }
            }

            // 3. UI Switch
            document.getElementById('start-screen').style.display = 'none';
            isRunning = true;
            
            // 4. Listeners
            window.addEventListener('deviceorientation', handleOrientation);
            // Запускаем игровой цикл рендеринга
            requestAnimationFrame(renderLoop);
        }

        // --- ЛОГИКА ГИРОСКОПА (СТАБИЛИЗАЦИЯ) ---
        function handleOrientation(e) {
            if (!isRunning) return;

            // В горизонтальном режиме (landscape):
            // Beta (-180..180) - это наклон телефона "на себя / от себя". В очках это поворот ВЛЕВО-ВПРАВО.
            // Gamma (-90..90) - это наклон "влево / вправо". В очках это наклон ВВЕРХ-ВНИЗ.

            let rawBeta = e.beta; 
            let rawGamma = e.gamma;

            // Защита от null (бывает на десктопе или при старте)
            if (rawBeta === null || rawGamma === null) return;

            // Первая калибровка (установка нуля)
            if (baseBeta === 0 && baseGamma === 0) {
                baseBeta = rawBeta;
                baseGamma = rawGamma;
            }

            // Вычисляем разницу от начальной позиции (Delta)
            let diffX = rawBeta - baseBeta;
            let diffY = rawGamma - baseGamma;

            // Обработка "скачка" через 180 градусов (если вдруг перевернули)
            // Но для VR очков обычно углы небольшие, так что просто ограничиваем (Clamp)
            // Ограничиваем угол обзора до +/- 40 градусов, чтобы не выворачивать картинку
            if (diffX > 40) diffX = 40;
            if (diffX < -40) diffX = -40;
            if (diffY > 40) diffY = 40;
            if (diffY < -40) diffY = -40;

            // Инверсия осей и применение чувствительности
            // Beta (Left/Right) -> X axis
            // Gamma (Up/Down) -> Y axis
            targetX = diffX * SENSITIVITY; 
            targetY = diffY * SENSITIVITY; 
        }

        function recalibrate() {
            // Сброс калибровки, чтобы текущее положение стало центром
            baseBeta = 0; 
            baseGamma = 0; 
            // При следующем событии orientation переменные обновятся
        }

        // --- РЕНДЕРИНГ (ПЛАВНОСТЬ) ---
        function renderLoop() {
            if (!isRunning) return;

            // Линейная интерполяция (Lerp) для сглаживания рывков
            // Каждый кадр мы двигаемся к цели на 8% (SMOOTH_FACTOR)
            // Это фильтрует высокочастотный шум (дрожание рук)
            curX += (targetX - curX) * SMOOTH_FACTOR;
            curY += (targetY - curY) * SMOOTH_FACTOR;

            // Применяем позицию
            // Левый глаз: сдвигаем контент ВПРАВО (+offset)
            // Правый глаз: сдвигаем контент ВЛЕВО (-offset)
            const tL = `translate(calc(-50% + ${curX + STEREO_OFFSET}px), calc(-50% + ${curY}px))`;
            const tR = `translate(calc(-50% + ${curX - STEREO_OFFSET}px), calc(-50% + ${curY}px))`;

            wL.style.transform = tL;
            wR.style.transform = tR;

            requestAnimationFrame(renderLoop);
        }

        // --- МЕДИА ФУНКЦИИ ---
        function clearStage() {
            wL.innerHTML = ''; wR.innerHTML = '';
            // Жесткая остановка всех видео
            document.querySelectorAll('video').forEach(v => {
                v.pause();
                v.src = "";
                if(v.srcObject) v.srcObject.getTracks().forEach(t => t.stop());
            });
        }

        function handleFile(input, type) {
            const f = input.files[0];
            if (!f) return;
            const url = URL.createObjectURL(f);
            
            clearStage();

            if (type === 'img') {
                const img = `<img src="${url}">`;
                wL.innerHTML = img; wR.innerHTML = img;
            } else {
                setupVideo(url);
            }
        }

        function setupVideo(url) {
            // Создаем видео программно
            const vL = document.createElement('video');
            vL.src = url;
            vL.loop = true;
            vL.muted = true; // Важно для автостарта!
            vL.playsInline = true; 
            vL.setAttribute('playsinline', ''); // Для старых iOS
            
            const vR = vL.cloneNode(); // Копия для правого глаза
            vR.src = url;
            vR.loop = true;
            vR.muted = true;
            vR.playsInline = true;
            vR.setAttribute('playsinline', '');

            wL.appendChild(vL);
            wR.appendChild(vR);

            // Запускаем оба сразу
            const p1 = vL.play();
            const p2 = vR.play();

            // Если браузер заблокировал автоплей (бывает с аудио), пробуем еще раз
            if (p1 !== undefined) {
                p1.catch(error => {
                    alert("Нажмите на экран для старта видео (браузер заблокировал автоплей)");
                });
            }
            
            // Примитивная синхронизация при перемотке/паузе
            // Синхронизируем раз в секунду или при клике, но не постоянно (вызывает лаги)
            vL.addEventListener('timeupdate', () => {
                // Если рассинхрон больше 0.5 сек, подгоняем правое видео
                if (Math.abs(vL.currentTime - vR.currentTime) > 0.5) {
                    vR.currentTime = vL.currentTime;
                }
            });
        }

        async function initCamera() {
            clearStage();
            try {
                const stream = await navigator.mediaDevices.getUserMedia({
                    video: { facingMode: 'environment' },
                    audio: false
                });

                const vL = document.createElement('video');
                vL.srcObject = stream;
                vL.autoplay = true; vL.muted = true; vL.playsInline = true;
                
                const vR = document.createElement('video'); // Лучше создать новый, чем клонировать поток
                vR.srcObject = stream;
                vR.autoplay = true; vR.muted = true; vR.playsInline = true;

                wL.appendChild(vL);
                wR.appendChild(vR);
            } catch (err) {
                alert("Ошибка камеры: " + err.message);
            }
        }

        // --- УПРАВЛЕНИЕ КАСАНИЯМИ ---
        // Одиночный клик по экрану скрывает/показывает меню
        let lastTap = 0;
        document.getElementById('vr-stage').addEventListener('click', (e) => {
            const now = Date.now();
            if (now - lastTap > 300) {
                 const ui = document.getElementById('ui-layer');
                 ui.style.opacity = (ui.style.opacity === '0') ? '1' : '0';
                 ui.style.pointerEvents = (ui.style.opacity === '0') ? 'none' : 'auto';
            }
            lastTap = now;
        });

    </script>
</body>
</html>
