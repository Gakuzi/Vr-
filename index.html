<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <title>Spatial VR Viewer</title>
    <style>
        /* --- CORE --- */
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; }
        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            background-color: #000; overflow: hidden;
            font-family: -apple-system, system-ui, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            color: #fff;
        }

        /* --- ROTATE HINT (Portrait only) --- */
        #rotate-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: #000; z-index: 9999;
            display: none; flex-direction: column;
            justify-content: center; align-items: center;
            text-align: center;
        }
        .icon-rotate {
            width: 40px; height: 64px; border: 3px solid #fff; border-radius: 6px;
            animation: spin 2s infinite ease-in-out; margin-bottom: 20px;
        }
        @keyframes spin { 0% {transform: rotate(0deg);} 50% {transform: rotate(90deg);} 100% {transform: rotate(0deg);} }
        
        @media (orientation: portrait) {
            #rotate-overlay { display: flex; }
        }

        /* --- START SCREEN --- */
        #start-screen {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: #000; z-index: 5000;
            display: flex; flex-direction: column;
            justify-content: center; align-items: center;
            transition: opacity 0.5s;
        }
        
        button.start-btn {
            background: transparent; border: 2px solid #0f0; color: #0f0;
            padding: 15px 40px; font-size: 18px; border-radius: 30px;
            text-transform: uppercase; letter-spacing: 2px; cursor: pointer;
            font-weight: bold;
        }
        button.start-btn:active { background: rgba(0, 255, 0, 0.2); }

        /* --- VR STAGE --- */
        #vr-stage {
            display: flex; width: 100%; height: 100%; position: relative; z-index: 1;
        }
        .eye {
            width: 50%; height: 100%; position: relative; overflow: hidden;
            border-right: 1px solid #222; background: #000;
        }
        .eye:last-child { border-right: none; }

        /* The Content World - 160% size for spatial looking */
        .world {
            position: absolute; top: 50%; left: 50%;
            width: 160vw; height: 160vh;
            transform: translate(-50%, -50%);
            display: flex; justify-content: center; align-items: center;
            will-change: transform;
        }
        .world img, .world video {
            width: 100%; height: 100%; object-fit: cover;
        }

        /* --- CONTROLS UI --- */
        #ui-layer {
            position: fixed; bottom: 0; left: 0; width: 100%; height: 100px;
            display: flex; justify-content: center; align-items: center;
            z-index: 100; pointer-events: none;
            transition: opacity 0.3s;
        }
        .hidden { opacity: 0; }
        
        .dock {
            background: rgba(20,20,20,0.8); backdrop-filter: blur(10px);
            padding: 10px 20px; border-radius: 30px;
            display: flex; gap: 15px; pointer-events: auto;
            border: 1px solid rgba(255,255,255,0.1);
        }

        .dock button {
            background: transparent; border: 1px solid #fff; color: #fff;
            padding: 8px 16px; border-radius: 20px; font-size: 12px;
            text-transform: uppercase; cursor: pointer;
        }
        .dock button:active { background: rgba(255,255,255,0.3); }

    </style>
</head>
<body>

    <!-- 1. Rotate Warning -->
    <div id="rotate-overlay">
        <div class="icon-rotate"></div>
        <p>Поверните горизонтально</p>
    </div>

    <!-- 2. Start Screen (Required for iOS Permissions) -->
    <div id="start-screen">
        <button class="start-btn" onclick="startVR()">Войти в VR</button>
        <p style="color:#666; font-size:12px; margin-top:15px">Требуется доступ к датчикам</p>
    </div>

    <!-- 3. VR Scene -->
    <div id="vr-stage">
        <div class="eye"><div class="world" id="w-left"></div></div>
        <div class="eye"><div class="world" id="w-right"></div></div>
    </div>

    <!-- 4. Controls -->
    <div id="ui-layer">
        <div class="dock">
            <button onclick="document.getElementById('f-photo').click()">Фото</button>
            <button onclick="document.getElementById('f-video').click()">Видео</button>
            <button onclick="activateCamera()">Камера</button>
        </div>
    </div>

    <!-- Hidden Inputs -->
    <input type="file" id="f-photo" accept="image/*" style="display:none" onchange="loadFile(this, 'img')">
    <input type="file" id="f-video" accept="video/*" style="display:none" onchange="loadFile(this, 'vid')">

    <script>
        // --- SETTINGS ---
        const SENSITIVITY = 12; // Коэффициент движения (пиксели на градус)
        const SMOOTHING = 0.08; // Плавность (меньше = плавнее)
        const STEREO_GAP = 14;  // Сдвиг для 3D эффекта

        // --- STATE ---
        let isRunning = false;
        let currentX = 0, currentY = 0;
        let targetX = 0, targetY = 0;
        const wLeft = document.getElementById('w-left');
        const wRight = document.getElementById('w-right');

        // --- LAUNCHER ---
        async function startVR() {
            const btn = document.querySelector('.start-btn');
            btn.innerText = "Загрузка...";

            // 1. Fullscreen Request
            const doc = document.documentElement;
            if (doc.requestFullscreen) doc.requestFullscreen().catch(()=>{});
            else if (doc.webkitRequestFullscreen) doc.webkitRequestFullscreen().catch(()=>{});

            // 2. iOS Gyro Permission
            if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
                try {
                    const resp = await DeviceOrientationEvent.requestPermission();
                    if (resp !== 'granted') {
                        alert("Нет доступа к гироскопу. VR не будет работать.");
                        return;
                    }
                } catch (e) {
                    alert("Ошибка датчиков: " + e);
                }
            }

            // 3. Start App
            document.getElementById('start-screen').style.opacity = 0;
            setTimeout(() => document.getElementById('start-screen').remove(), 500);
            
            window.addEventListener('deviceorientation', handleGyro);
            isRunning = true;
            renderLoop();
        }

        // --- PHYSICS ---
        function handleGyro(e) {
            if (!e.gamma && !e.beta) return;

            // Ограничиваем углы, чтобы картинка не уходила в бесконечность
            let g = Math.max(-45, Math.min(45, e.gamma || 0));
            let b = Math.max(-45, Math.min(45, e.beta || 0));

            // Конвертация угла в пиксели смещения
            // Инверсия для эффекта "окна" (поворот головы влево -> контент вправо)
            targetX = g * SENSITIVITY; 
            targetY = b * SENSITIVITY;
        }

        function renderLoop() {
            if (!isRunning) return;

            // Интерполяция (Lerp)
            currentX += (targetX - currentX) * SMOOTHING;
            currentY += (targetY - currentY) * SMOOTHING;

            // Применение трансформации с учетом стерео-базы
            // Левый глаз видит со смещением вправо (+), Правый влево (-)
            const transformL = `translate(calc(-50% + ${currentX + STEREO_GAP}px), calc(-50% + ${currentY}px))`;
            const transformR = `translate(calc(-50% + ${currentX - STEREO_GAP}px), calc(-50% + ${currentY}px))`;

            wLeft.style.transform = transformL;
            wRight.style.transform = transformR;

            requestAnimationFrame(renderLoop);
        }

        // --- CONTENT MANAGER ---
        function clearStage() {
            wLeft.innerHTML = ''; wRight.innerHTML = '';
            // Сброс всех потоков и видео
            document.querySelectorAll('video').forEach(v => {
                v.pause();
                if (v.srcObject) v.srcObject.getTracks().forEach(t => t.stop());
            });
        }

        function loadFile(input, type) {
            const file = input.files[0];
            if (!file) return;
            const url = URL.createObjectURL(file);
            clearStage();

            if (type === 'img') {
                const html = `<img src="${url}">`;
                wLeft.innerHTML = html; wRight.innerHTML = html;
            } else {
                // Video Sync
                const vL = createVideo(url, false);
                const vR = createVideo(url, true);
                
                // Синхронизация
                vL.onplay = () => vR.play();
                vL.onpause = () => vR.pause();
                vL.onseeking = () => vR.currentTime = vL.currentTime;

                wLeft.appendChild(vL); wRight.appendChild(vR);
                vL.play().catch(()=>{});
            }
        }

        async function activateCamera() {
            clearStage();
            try {
                const stream = await navigator.mediaDevices.getUserMedia({
                    video: { facingMode: 'environment', width: {ideal: 1280} },
                    audio: false
                });

                const vL = document.createElement('video');
                vL.srcObject = stream;
                vL.autoplay = true; vL.muted = true; vL.playsInline = true;

                const vR = vL.cloneNode();
                vR.srcObject = stream;
                vR.autoplay = true; vR.muted = true; vR.playsInline = true;

                wLeft.appendChild(vL); wRight.appendChild(vR);
            } catch (e) {
                alert("Камера недоступна (проверьте HTTPS).");
            }
        }

        function createVideo(src, muted) {
            const v = document.createElement('video');
            v.src = src; v.loop = true; v.playsInline = true;
            if (muted) v.muted = true;
            return v;
        }

        // --- GESTURES (Tap to hide UI) ---
        let lastTap = 0;
        document.getElementById('vr-stage').addEventListener('click', () => {
            const now = Date.now();
            const ui = document.getElementById('ui-layer');
            
            // Double tap logic could go here, but keeping it simple for now
            if (now - lastTap > 300) { 
                ui.classList.toggle('hidden');
            }
            lastTap = now;
        });

    </script>
</body>
</html>
